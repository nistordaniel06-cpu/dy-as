<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>DY-AS · Colecții pentru cotidian</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:5rem}body{margin:0;background:#10110f;color:#f5f3ed;font:1rem/1.45 system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #eac28b;outline-offset:3px}[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:2;background:#10110ff5;border-bottom:1px solid #ffffff24}.bar-inner{width:min(82rem,100%);margin:auto;padding:0 4%;height:4.4rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand{font:750 1.7rem/1 system-ui,sans-serif;letter-spacing:-.075em}.control,.close{background:transparent;border:0;min-width:2.8rem;min-height:2.8rem;display:inline-grid;place-items:center;padding:0}.control:first-child{justify-self:start}.control:last-child{justify-self:end}.menu-icon{width:1.5rem;height:.64rem;border-block:1.7px solid}.glass{width:1.04rem;height:1.04rem;border:1.7px solid;border-radius:50%;position:relative}.glass:after{content:'';position:absolute;width:.55rem;border-top:1.7px solid;right:-.39rem;bottom:-.16rem;transform:rotate(48deg)}
/* Photography stays inside its own frame so lettering never overlaps the product. */
.hero{display:grid;grid-template-columns:.88fr 1.12fr;max-width:90rem;margin:auto;background:#171612}
.shot{display:block;align-self:center;background:#201b14}
.shot img{display:block;width:100%;height:auto}
.hero-copy{padding:clamp(2rem,5vw,5.5rem);display:flex;flex-direction:column;align-items:start;justify-content:center}.hero h1{margin:0;font:400 clamp(3.2rem,5.1vw,5.5rem)/.97 Georgia,serif;letter-spacing:-.065em}.hero em{color:#dfc59f;font-weight:400}.cta{margin-top:1.8rem;background:#f2eee6;color:#181815;border-radius:2rem;padding:.85rem 1.25rem;font-size:.92rem;font-weight:600}.cta span{padding-left:1rem}
.content{width:min(82rem,100%);padding:0 4%;margin:auto}.section{padding:3.3rem 0}.heading,.foot,.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:1rem}.heading{margin-bottom:1.4rem}h2{margin:0;font:400 clamp(2rem,3.5vw,3.4rem)/1.05 Georgia,serif;letter-spacing:-.055em}.filter{border:1px solid #4a4b45;border-radius:2rem;background:#20211d;color:#efeee6;min-height:2.8rem;padding:.45rem 1rem}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.3rem 1.15rem}.photo{overflow:hidden;aspect-ratio:1/1.08;border-radius:.6rem;background:#ebe9e4}.photo img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.card small{display:block;margin:.8rem 0 .26rem;color:#c9b797;font-size:.76rem}.card h3{font-size:1.05rem;line-height:1.25;font-weight:540;margin:0;text-wrap:pretty}.card p{font-size:.95rem;margin:.35rem 0;color:#e3ded3;font-variant-numeric:tabular-nums}.tools{border-top:1px solid #41423a}.tools .grid{grid-template-columns:1fr 1fr}.tools .card{background:#20211e;padding:1.4rem;border-radius:.6rem}.tools .card small{display:none}.status{color:#cfb994}.foot{border-top:1px solid #41423a;padding:1.5rem 0}.foot p{margin:0;font-size:.85rem;color:#bdbeb5}.empty{color:#ccc}
dialog{color:#252620;border:0;background:#f3f1e9;border-radius:1.1rem;width:min(28rem,calc(100% - 2rem));max-height:82dvh;padding:1.4rem}dialog::backdrop{background:#000b}.dialog-head{margin-bottom:1rem}.dialog-head h2{font-size:2rem}.close{font-size:1.8rem}.choices{display:grid}.choices button,.choices a{background:transparent;border:0;border-top:1px solid #cbc9bd;min-height:3rem;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:.55rem .15rem}.choices a:after{content:'';width:.47rem;height:.47rem;margin-right:.35rem;border-right:1.5px solid #68685d;border-top:1.5px solid #68685d;transform:rotate(45deg)}.choices button[aria-pressed=true]:after{content:'';width:.45rem;height:.45rem;border-radius:100%;background:#5a5747}.choices [aria-pressed=true]{font-weight:750}.search-form{display:flex;gap:.5rem}.search-form input{min-width:0;width:100%;border:1px solid #95968a;background:white;padding:.8rem;border-radius:.55rem}.search-form button{background:#272923;color:white;border:0;border-radius:.55rem;padding:.6rem 1rem}.result{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}.result button{background:none;border:0;color:#e0c89e;text-decoration:underline;min-height:2.75rem}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* The large portrait breakpoint also covers Android's desktop viewport. */
.brand{display:inline-flex;min-width:44px;min-height:44px;align-items:center;justify-content:center}
.hero-copy{background:linear-gradient(110deg,#151411,#1e1a15);padding:clamp(2rem,6vw,6rem)}
.hero h1{font-size:clamp(3.3rem,6vw,6.2rem)}
.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:1.8rem;min-height:44px}
.filter,.control,.close,.choices a,.choices button,.result button,.search-form button{min-height:max(44px,2.8rem);min-width:max(44px,2.8rem)}
.card h3{font-weight:570}.card p{font-weight:600}.tools .card{padding:0;background:transparent}.tools .card p{font-weight:400}
.tools .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tools h3{margin-top:.65rem}.tools .photo{aspect-ratio:1.65;background:#e9e7e1;padding:.65rem}
.tools .photo img{mix-blend-mode:multiply}.photo{background:#eeeae3}.card h3{min-height:2.5em}
.card small{text-transform:uppercase;font-size:.65rem;letter-spacing:.12em;font-weight:650}
.dialog-head h2{font-family:Georgia,serif}.choices a{font-size:1.12rem;padding:.85rem .1rem}
.dialog-head{padding-bottom:.4rem}.result{flex-wrap:wrap}.result span{flex:1}.result button{font-weight:600}.empty{color:#ded8ca}
body:has(dialog[open]){overflow:hidden}
@media(max-width:700px),(max-width:1050px) and (orientation:portrait){
html{font-size:clamp(16px,4.1vw,42px);scroll-padding-top:4.25rem}
.bar-inner{height:3.6rem;padding:0 .92rem}.bar-inner .brand{font-size:1.48rem}
.hero{grid-template-columns:1fr;background:#191713}.shot{grid-row:1;align-self:stretch;position:relative;aspect-ratio:1.6;overflow:hidden}
.shot img{height:100%;object-fit:cover;object-position:50% 55%}
.hero-copy{padding:1.3rem 1.2rem 1.5rem;background:#191713}.hero h1{font-size:2.8rem;line-height:.97}
.hero h1 br{display:initial}.cta{margin-top:1.1rem;padding:.68rem 1.05rem;min-height:2.8rem}
.content{padding:0 1.05rem}.section{padding:1.8rem 0}.heading{margin-bottom:1rem}h2{font-size:2.15rem}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem .72rem}.photo{aspect-ratio:1.17}.card h3{font-size:1rem}
.card p{font-size:.95rem}.card small{margin-top:.72rem}.tools .photo{aspect-ratio:1/.9;padding:.32rem}
.status{font-size:.78rem}.tools .heading{align-items:baseline}.tools h2{font-size:1.8rem}
.foot p{max-width:16em}.filter{font-size:.9rem}
dialog{margin:auto auto 0;width:100%;max-width:none;max-height:85dvh;border-radius:1.45rem 1.45rem 0 0;padding:1.1rem 1.25rem max(1.5rem,env(safe-area-inset-bottom))}
dialog::before{content:"";display:block;width:2.5rem;height:.22rem;background:#aca99e;border-radius:1rem;margin:0 auto 1rem}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<header class="bar"><div class="bar-inner"><button class="control" aria-label="Deschide meniul" aria-haspopup="dialog" data-open="menu"><i class="menu-icon" aria-hidden="true"></i></button><a href="./" class="brand" aria-label="DY-AS, pagina principală">DY-AS</a><button class="control" aria-label="Caută produse" aria-haspopup="dialog" data-open="search"><i class="glass" aria-hidden="true"></i></button></div></header>
<main><section class="hero"><div class="hero-copy"><h1>Ordinea,<br> <em>făcută frumos.</em></h1><a href="#produse" class="cta">Descoperă produsele <span aria-hidden="true">↓</span></a></div><picture class="shot"><source media="(max-width:700px),(max-width:1050px) and (orientation:portrait)" srcset="media/hero-mobile.webp"><img src="media/hero-desktop.webp" width="870" height="700" alt="Trusă matlasată și organizator pe un soclu de piatră, în lumină caldă" fetchpriority="high"></picture></section>
<div class="content"><section class="section" id="produse"><div class="heading"><h2>Colecția</h2><button class="filter" data-open="filters" aria-haspopup="dialog">Categorii ⌄</button></div><div class="result" hidden><span aria-live="polite"></span><button>Arată toate produsele</button></div><div class="grid"><!-- PRODUCT_CARDS --></div></section>
<section class="section tools" id="scule"><div class="heading"><h2>Scule și unelte</h2><span class="status">În pregătire</span></div><div class="grid"><!-- TOOL_CARDS --></div></section>
<footer class="foot"><b class="brand">DY-AS</b><p>Catalog de prezentare. Comenzile online se deschid la lansare.</p></footer></div></main>
<dialog aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title">Meniu</h2><button class="close" aria-label="Închide">×</button></div><div class="choices"></div><form class="search-form" hidden><input type="search" aria-label="Nume sau categorie" placeholder="Nume sau categorie"><button>Caută</button></form></dialog>
<script>
const dialog=document.querySelector('dialog'), choices=dialog.querySelector('.choices'), form=dialog.querySelector('form');
const cards=[...document.querySelectorAll('.card')], result=document.querySelector('.result'), productSection=document.querySelector('#produse'), toolSection=document.querySelector('#scule');
const categories=[...new Set(cards.map(card=>card.dataset.category))];
const normalize=text=>text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let active='Toate';
function showProducts(category='Toate',query=''){
 active=category;
 const term=normalize(query.trim());
 cards.forEach(card=>{card.hidden=(category!=='Toate' && card.dataset.category!==category) || !normalize(card.textContent).includes(term)});
 const count=cards.filter(card=>!card.hidden).length;
 productSection.querySelector('.grid').hidden=!cards.some(card=>productSection.contains(card)&&!card.hidden);
 toolSection.hidden=!cards.some(card=>toolSection.contains(card)&&!card.hidden);
 result.hidden=category==='Toate'&&!term;
 const label=query.trim() ? '„'+query.trim()+'”' : category;
 result.querySelector('span').textContent=count ? [label,count===1?'1 produs':count+' produse'].join(' · ') : 'Nu am găsit produse pentru '+label+'.';
 if(dialog.open)dialog.close();
 productSection.scrollIntoView();
}
function openPanel(type){
 choices.replaceChildren();
 form.hidden=type!=='search'; choices.hidden=!form.hidden;
 dialog.querySelector('h2').textContent={menu:'Meniu',filters:'Categorii',search:'Caută produse'}[type];
 if(type==='menu'){
  [['Colecția DY-AS','produse'],['Scule și unelte','scule']].forEach(([label,id])=>{
   const link=document.createElement('a');link.href='#'+id;link.textContent=label;
   link.onclick=event=>{event.preventDefault();showProducts();document.getElementById(id).scrollIntoView()};choices.append(link);
  });
 }else if(type==='filters'){
  ['Toate',...categories].forEach(category=>{const button=document.createElement('button');button.textContent=category;button.setAttribute('aria-label',category);button.setAttribute('aria-pressed',String(active===category));button.onclick=()=>showProducts(category);choices.append(button)});
 }
 dialog.showModal();
 if(type==='search')form.querySelector('input').focus();
}
document.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>openPanel(button.dataset.open));
dialog.querySelector('.close').onclick=()=>dialog.close();
dialog.addEventListener('click',event=>{if(event.target===dialog){const b=dialog.getBoundingClientRect();if(event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom)dialog.close()}});
form.onsubmit=event=>{event.preventDefault();showProducts('Toate',form.querySelector('input').value.trim())};
result.querySelector('button').onclick=()=>{form.reset();showProducts()};
</script></body></html>
